<!DOCTYPE html>
<html lang="vi">
  <head>
    <title>Đăng ký | Study With AI</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .register-container {
        width: 100%;
        max-width: 450px;
        padding: 20px;
      }

      .register-card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        padding: 40px;
        animation: slideUp 0.5s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 1px;
        margin-bottom: 5px;
      }

      .tagline {
        color: #6c757d;
        font-size: 14px;
        margin-bottom: 30px;
        text-align: center;
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-label {
        font-size: 13px;
        font-weight: 600;
        color: #333;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        display: block;
      }

      .form-control {
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px 15px;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.1);
      }

      .form-control::placeholder {
        color: #aaa;
      }

      .input-icon {
        position: relative;
      }

      .input-icon i {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
        font-size: 16px;
      }

      .btn-register {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        color: white;
        font-weight: 600;
        padding: 12px;
        border-radius: 8px;
        font-size: 15px;
        transition: all 0.3s ease;
        width: 100%;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        color: white;
      }

      .btn-register:active {
        transform: translateY(0);
      }

      .alert {
        border-radius: 8px;
        border: none;
        margin-bottom: 20px;
        font-size: 14px;
      }

      .alert-danger {
        background-color: #fee;
        color: #c33;
      }

      .divider {
        text-align: center;
        margin: 25px 0;
        position: relative;
        color: #999;
        font-size: 13px;
      }

      .divider::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 100%;
        height: 1px;
        background: #e0e0e0;
      }

      .divider span {
        background: white;
        padding: 0 10px;
        position: relative;
      }

      .login-link {
        text-align: center;
        color: #666;
        font-size: 14px;
      }

      .login-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
      }

      .login-link a:hover {
        color: #764ba2;
        text-decoration: underline;
      }

      .password-note {
        font-size: 12px;
        color: #999;
        margin-top: 5px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      @media (max-width: 480px) {
        .register-card {
          padding: 30px 20px;
        }

        .form-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="register-container">
      <div class="register-card">
        <div style="text-align: center;">
          <div class="brand">Study With AI</div>
          <p class="tagline">Tạo tài khoản để bắt đầu hành trình học tập của bạn</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" role="alert">
          <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/register" novalidate>
          <div class="form-group">
            <label for="name" class="form-label">
              <i class="fas fa-user"></i> Họ và tên
            </label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              class="form-control" 
              placeholder="Nguyễn Văn A" 
              required 
            />
          </div>

          <div class="form-group">
            <label for="email" class="form-label">
              <i class="fas fa-envelope"></i> Email
            </label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-control" 
              placeholder="example@gmail.com" 
              required 
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">
              <i class="fas fa-lock"></i> Mật khẩu
            </label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="Nhập mật khẩu" 
              required 
            />
            <p class="password-note">Mật khẩu phải có ít nhất 6 ký tự</p>
          </div>

          <div class="form-group">
            <label for="confirm_password" class="form-label">
              <i class="fas fa-lock"></i> Xác nhận mật khẩu
            </label>
            <input 
              type="password" 
              id="confirm_password" 
              name="confirm_password" 
              class="form-control" 
              placeholder="Nhập lại mật khẩu" 
              required 
            />
          </div>

          <button type="submit" class="btn-register">
            <i class="fas fa-user-plus"></i> Đăng ký
          </button>

          <div class="login-link">
            Bạn đã có tài khoản? <a href="/login">Đăng nhập ngay</a>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
            <a href="/templates/login.html" class="login-link fw-semibold">Login</a>
          </small>
        </div>
      </form>
    </div>
  </body>
</html>
