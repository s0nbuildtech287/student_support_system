<!DOCTYPE html>
<html lang="vi">
  <head>
    <title>Workout AI</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="{{ url_for('static', filename='css/common.css') }}" rel="stylesheet" />
    <link href="{{ url_for('static', filename='css/home.css') }}" rel="stylesheet" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container d-flex justify-content-between">
        <a class="navbar-brand fw-bold" href="/">Workout AI</a>

        <div class="collapse navbar-collapse justify-content-center">
          <ul class="navbar-nav gap-4">
            <li class="nav-item">
              <a class="nav-link active" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/exercise">Exercise</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/ranking">Ranking</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/information">Information</a>
            </li>
          </ul>
        </div>

        <!-- User Avatar -->
        <div class="user-avatar-wrapper" id="userAvatarBtn">
          <img src="https://i.pravatar.cc/150?img=1" alt="User Avatar" class="user-avatar">
          <!-- User Dropdown -->
          <div class="user-dropdown" id="userDropdown">
            <div class="user-dropdown-header">
              <div class="user-info">
                <img src="https://i.pravatar.cc/150?img=1" alt="User" class="user-info-avatar">
                <div class="user-info-text">
                  <h6>Khang Nguyen</h6>
                  <small>khang@example.com</small>
                </div>
              </div>
            </div>
            <div class="user-dropdown-menu">
              <a href="{{ url_for('user.profile') }}" class="user-dropdown-item">👤 Hồ sơ cá nhân</a>
              <a href="{{ url_for('user.settings') }}" class="user-dropdown-item">⚙️ Cài đặt</a>
              <a href="{{ url_for('user.statistics') }}" class="user-dropdown-item">📊 Thống kê</a>
              <div class="user-dropdown-divider"></div>
              <a href="#" class="user-dropdown-item">🚪 Đăng xuất</a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <div class="container mt-4">
      <div class="row g-4">
        <!-- Form -->
        <div class="col-md-5">
          <div class="card h-100 p-4">
            <h5 class="text-center mb-3 fw-bold">Nhập thông tin luyện tập</h5>

            <form method="POST" action="/recommend">
              <!-- Age -->
              <label for="age" class="visually-hidden">Tuổi</label>
              <input id="age" name="age" type="number" class="form-control mb-2" placeholder="Tuổi" required />

              <!-- Height -->
              <label for="height" class="visually-hidden">Chiều cao</label>
              <input id="height" name="height" type="number" class="form-control mb-2" placeholder="Chiều cao (cm)" required />

              <!-- Weight -->
              <label for="weight" class="visually-hidden">Cân nặng</label>
              <input id="weight" name="weight" type="number" class="form-control mb-2" placeholder="Cân nặng (kg)" required />

              <!-- Goal -->
              <label for="goal" class="visually-hidden">Mục tiêu</label>
              <select id="goal" name="goal" class="form-select mb-2" required>
                <option value="">-- Mục tiêu --</option>
                <option value="lose">Giảm cân</option>
                <option value="gain">Tăng cơ</option>
                <option value="maintain">Giữ dáng</option>
              </select>

              <!-- Place -->
              <label for="place" class="visually-hidden">Nơi tập</label>
              <select id="place" name="place" class="form-select mb-2">
                <option value="">Tất cả nơi tập</option>
                <option value="home">Tập tại nhà</option>
                <option value="gym">Gym</option>
              </select>

              <!-- Equipment -->
              <div id="equipment-wrapper" style="display: none">
                <label for="equipment" class="visually-hidden">Thiết bị</label>
                <select id="equipment" name="equipment" class="form-select mb-2">
                  <option value="">-- Chọn thiết bị --</option>
                  <option value="bodyweight">Không dụng cụ</option>
                  <option value="dumbbell">Tạ đơn</option>
                  <option value="barbell">Tạ đòn</option>
                  <option value="band">Dây kháng lực</option>
                </select>
              </div>

              <!-- Level -->
              <label for="level" class="visually-hidden">Trình độ</label>
              <select id="level" name="level" class="form-select mb-3">
                <option value="beginner">Mới tập</option>
                <option value="intermediate">Trung bình</option>
                <option value="advanced">Nâng cao</option>
              </select>

              <button type="submit" class="btn btn-dark w-100">Gợi ý bài tập</button>
            </form>
          </div>
        </div>

        <!-- Charts -->
        <div class="col-md-7">
          <div class="row g-4">
            <!-- Pie -->
            <div class="col-12">
              <div class="card p-3">
                <h6 class="text-center fw-bold">Tiến trình hoàn thành</h6>
                <div class="chart-box">
                  <canvas id="progressChart"></canvas>
                </div>
              </div>
            </div>

            <!-- Bar -->
            <div class="col-12">
              <div class="card p-3">
                <h6 class="text-center fw-bold">Xu hướng kiểu tập luyện</h6>
                <div class="chart-box">
                  <canvas id="trendChart"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center">
      <div class="container">
        <p class="mb-1">© 2025 Workout AI</p>
        <small>Hệ thống gợi ý luyện tập thông minh</small>
      </div>
    </footer>

    <!-- Charts -->
    <script>
      new Chart(document.getElementById("progressChart"), {
        type: "pie",
        data: {
          labels: ["Hoàn thành", "Chưa hoàn thành"],
          datasets: [
            {
              data: [18, 12],
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
        },
      });

      new Chart(document.getElementById("trendChart"), {
        type: "bar",
        data: {
          labels: ["Gym", "Cardio", "Calisthenics", "HIIT"],
          datasets: [
            {
              data: [40, 30, 25, 20],
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
        },
      });

      // Logic: Home thì mới hiện dụng cụ tập
      const place = document.getElementById("place");
      const equipmentWrapper = document.getElementById("equipment-wrapper");
      const equipment = document.getElementById("equipment");

      place.addEventListener("change", () => {
        if (place.value === "home") {
          equipmentWrapper.style.display = "block";
        } else {
          equipmentWrapper.style.display = "none";
          equipment.value = ""; // reset khi ẩn
        }
      });

      // User Avatar Dropdown
      const userAvatarBtn = document.getElementById('userAvatarBtn');
      const userDropdown = document.getElementById('userDropdown');

      userAvatarBtn.addEventListener('click', () => {
        userDropdown.classList.toggle('show');
      });

      // Close dropdown when clicking outside
      document.addEventListener('click', (e) => {
        if (!userAvatarBtn.contains(e.target)) {
          userDropdown.classList.remove('show');
        }
      });
    </script>
    <script src="{{ url_for('static', filename='js/user-dropdown.js') }}"></script>
  </body>
</html>
